  <script src="./script.js?v=2" defer></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, limit, startAfter, getDocs, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "/firebase-config.js";

    const root = document.getElementById('catalog-root');
    const loadMoreBtn = document.getElementById('load-more-brands');
    const PRODUCTS_PER_BRAND_PAGE = 9;                       // render 9 products per brand page (3 rows × 3 cols)
    const PRODUCT_QUERY_LIMIT = PRODUCTS_PER_BRAND_PAGE + 1; // 10 — fetch +1 only to detect whether a Next page exists
    const PAGE_SIZE = PRODUCTS_PER_BRAND_PAGE;               // alias used by the render/pager helpers
    const BRAND_PAGE = 5;  // brand sections per "page"
    const UNASSIGNED_SCAN = 200; // products scanned ONLY for the brandless catch-all (Firestore can't paginate a missing field)

    // ── Image loading: never hang. A stalled/failed/broken image falls back to the
    // placeholder (product) or is hidden (brand banner) so a section can't load forever.
    const IMG_TIMEOUT_MS = 10000; // stalled longer than this after entering view → fallback
    function failImage(img) {
      if (!img || img.__failed) return;
      img.__failed = true;
      const media = img.closest('.catalog-product-media');
      if (media) { img.remove(); media.classList.add('is-empty'); return; }
      const banner = img.closest('.catalog-brand-media');
      if (banner) banner.remove();
    }
    function armImage(img) {
      if (img.__armed || img.__failed) return;
      img.__armed = true;
      if (img.complete) { if (!img.naturalWidth) failImage(img); return; } // already loaded/broken
      const timer = setTimeout(() => failImage(img), IMG_TIMEOUT_MS);
      img.addEventListener('load', () => { clearTimeout(timer); if (!img.naturalWidth) failImage(img); }, { once: true });
      img.addEventListener('error', () => { clearTimeout(timer); failImage(img); }, { once: true });
    }
    let __imgIO = null;
    function imgIO() {
      if (__imgIO || typeof IntersectionObserver === 'undefined') return __imgIO;
      __imgIO = new IntersectionObserver((entries, obs) => {
        for (const e of entries) { if (e.isIntersecting) { obs.unobserve(e.target); armImage(e.target); } }
      }, { rootMargin: '300px' });
      return __imgIO;
    }
    // Arm the timeout only once an image is near the viewport (so lazy/offscreen
    // images aren't falsely failed before the browser even requests them).
    function watchImages(rootEl) {
      if (!rootEl) return;
      rootEl.querySelectorAll('img').forEach(img => {
        if (img.__watched) return;
        img.__watched = true;
        const io = imgIO();
        if (io) io.observe(img); else armImage(img);
      });
    }
    const PKG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>';

    // ── Safe helpers ──────────────────────────────────────────
    const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // Escape, then preserve the author's line breaks (改行) as <br> instead of merging them.
    const escapeLines = (s) => escapeHtml(s).replace(/\r\n|\r|\n/g, '<br>');
    const firstNonEmpty = (...vals) => {
      for (const v of vals) { if (v != null && String(v).trim() !== '') return String(v).trim(); }
      return '';
    };
    const dict = () => {
      const lang = localStorage.getItem('lang') || 'en';
      return (window.translations && (window.translations[lang] || window.translations.en)) || {};
    };
    const t = (key, fallback) => dict()[key] || fallback;

    function normalize(p) {
      return {
        name: firstNonEmpty(p.name),
        intro: firstNonEmpty(p.intro, p.description, p.desc),
        // Catalog cards: thumbUrl || imageUrl || displayUrl || originalUrl
        image: firstNonEmpty(p.thumbUrl, p.imageUrl, p.displayUrl, p.originalUrl),
        origin: firstNonEmpty(p.origin, p.productOrigin, p.countryOfOrigin, p.madeIn, p.sourceCountry),
        netWeight: firstNonEmpty(p.netWeight, p.net_weight, p.netweight),
        expiration: firstNonEmpty(p.expiration, p.expiry, p.expiryDate, p.expirationDate, p.shelfLife),
        packing: firstNonEmpty(p.packing, p.packaging, p.package, p.carton, p.cartonInfo)
      };
    }

    function specRow(labelKey, fallbackLabel, value, slug) {
      // Compact cards: hide an empty spec instead of showing a "—" row. Never undefined/null.
      if (value == null || String(value).trim() === '') return '';
      const mod = slug ? ` catalog-spec-row--${slug}` : '';
      return `<div class="catalog-spec-row${mod}"><dt>${escapeHtml(t(labelKey, fallbackLabel))}</dt><dd>${escapeHtml(String(value).trim())}</dd></div>`;
    }

    function productCardHtml(id, raw) {
      const p = normalize(raw);
      const name = escapeHtml(p.name);
      const hasImg = !!p.image;
      const ariaLabel = name || escapeHtml(t('catalog.uncategorized', 'Product'));
      return `
        <a class="catalog-product-card" href="/product-detail.html?id=${encodeURIComponent(id)}" aria-label="${ariaLabel}">
          <div class="catalog-product-media${hasImg ? '' : ' is-empty'}">
            ${hasImg ? `<img src="${escapeHtml(p.image)}" alt="${name ? `${name} product image` : 'Product image'}" loading="lazy" decoding="async">` : ''}
            <span class="catalog-product-ph" aria-hidden="true">${PKG_ICON}</span>
          </div>
          <div class="catalog-product-body">
            ${name ? `<h3 class="catalog-product-title">${name}</h3>` : ''}
            ${p.intro ? `<p class="catalog-product-intro">${escapeLines(p.intro)}</p>` : ''}
            <dl class="catalog-product-specs">
              ${specRow('catalog.spec.origin', 'Origin', p.origin, 'origin')}
              ${specRow('catalog.spec.netWeight', 'Net weight', p.netWeight, 'net-weight')}
              ${specRow('catalog.spec.expiration', 'Expiration', p.expiration, 'expiration')}
              ${specRow('catalog.spec.packing', 'Packing', p.packing, 'packing')}
            </dl>
          </div>
        </a>`;
    }

    let db = null;
    const brandCursor = { last: null, hasMore: false, done: false };
    let uncategorizedEl = null; // keep the Uncategorized section last

    // True per-brand cursor pagination, newest first. Fetch 13, render 12, use the
    // 13th only to know whether a Next page exists; page 2+ uses startAfter(lastDoc).
    // brand mode requires the composite index (products: published ASC, brandId ASC,
    // createdAt DESC) — see firestore.indexes.json. "all" mode uses published+createdAt.
    function productQuery(section, afterDoc) {
      const col = collection(db, 'products');
      const cons = [where('published', '==', true)];
      if (section.mode !== 'all') cons.push(where('brandId', '==', section.id));
      cons.push(orderBy('createdAt', 'desc'));
      if (afterDoc) cons.push(startAfter(afterDoc));
      cons.push(limit(PRODUCT_QUERY_LIMIT)); // 13 = render 12 + 1 to detect next page
      return query(col, ...cons);
    }

    function skeletonCards(n) {
      let s = '';
      for (let i = 0; i < n; i++) s += '<div class="catalog-product-card catalog-product-card--skeleton"><div class="catalog-product-media"></div><div class="catalog-product-body"><div class="sk-line lg"></div><div class="sk-line"></div><div class="sk-line sm"></div></div></div>';
      return s;
    }

    function renderPager(section) {
      const hasNext = !!section.hasNext[section.pageIndex];
      const hasPrev = section.pageIndex > 0;
      const multiPage = hasNext || hasPrev; // single page (≤6 products) → no arrows at all
      if (section.prevBtn) { section.prevBtn.hidden = !multiPage; section.prevBtn.disabled = !hasPrev; }
      if (section.nextBtn) { section.nextBtn.hidden = !multiPage; section.nextBtn.disabled = !hasNext; }
      if (!multiPage) { section.pagerEl.hidden = true; return; }
      section.pagerEl.hidden = false;
      const totalPages = (section.total != null) ? Math.max(1, Math.ceil(section.total / PAGE_SIZE)) : null;
      section.indicatorEl.textContent = totalPages != null ? `${section.pageIndex + 1} / ${totalPages}` : `${section.pageIndex + 1}`;
    }

    function buildGridFragment(items) {
      const frag = document.createDocumentFragment();
      const tmp = document.createElement('div');
      tmp.innerHTML = items.map(it => productCardHtml(it.id, it.data)).join('');
      while (tmp.firstChild) frag.appendChild(tmp.firstChild);
      return frag;
    }

    const prefersReducedMotion = () =>
      !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    function renderSectionPage(section, pageIndex) {
      const prevShown = section.displayedIndex;
      section.pageIndex = pageIndex;
      const items = section.pages[pageIndex] || [];
      const grid = section.gridEl;
      grid.className = 'catalog-product-grid';
      grid.setAttribute('aria-busy', 'false');

      const paint = () => {
        if (!items.length) {
          grid.innerHTML = `<p class="catalog-products-empty">${escapeHtml(t('catalog.products.empty', 'No products in this section yet.'))}</p>`;
          section.pagerEl.hidden = true;
          return;
        }
        grid.replaceChildren(buildGridFragment(items));
        watchImages(grid);
        renderPager(section);
        // Lock the grid to the tallest page seen so a shorter page (e.g. the last
        // page with fewer cards) can't collapse the section and jump the scroll.
        const multiPage = section.hasNext[pageIndex] || pageIndex > 0;
        if (multiPage) {
          grid.style.minHeight = '0px';                  // measure natural height
          section.fullH = Math.max(section.fullH || 0, grid.offsetHeight);
          grid.style.minHeight = section.fullH + 'px';
        } else {
          grid.style.minHeight = '';
        }
      };

      const animate = prevShown != null && prevShown !== pageIndex
        && !prefersReducedMotion() && typeof grid.animate === 'function';
      section.displayedIndex = pageIndex;

      // Cancel any in-flight animation so rapid clicks/swipes don't overlap or paint stale pages.
      if (section._anim) { try { section._anim.cancel(); } catch (e) {} section._anim = null; }

      if (!animate) { paint(); return; }

      const dir = pageIndex > prevShown ? 1 : -1;   // next → slide left, prev → slide right
      const dist = 20;                               // stays within the card padding (no page scroll)
      const out = grid.animate(
        [{ transform: 'translateX(0)', opacity: 1 }, { transform: `translateX(${-dir * dist}px)`, opacity: 0 }],
        { duration: 150, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }
      );
      section._anim = out;
      out.onfinish = () => {
        if (section._anim !== out) return;           // superseded by a newer render
        paint();
        const inn = grid.animate(
          [{ transform: `translateX(${dir * dist}px)`, opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }],
          { duration: 240, easing: 'cubic-bezier(.16,1,.3,1)' }
        );
        section._anim = inn;
        inn.onfinish = () => { if (section._anim === inn) section._anim = null; };
        try { out.cancel(); } catch (e) {}
      };
    }

    async function loadSectionPage(section, pageIndex) {
      if (section.loading) return;
      if (section.pages[pageIndex]) { renderSectionPage(section, pageIndex); return; } // cache hit
      section.loading = true;
      section.gridEl.setAttribute('aria-busy', 'true');
      try {
        // Catch-all for products with no brand. Firestore can't query a missing field,
        // so fetch recent published products once and keep only the unassigned ones,
        // then paginate that set on the client.
        if (section.mode === 'unassigned') {
          if (!section.allItems) {
            const snap = await getDocs(query(collection(db, 'products'),
              where('published', '==', true), orderBy('createdAt', 'desc'), limit(UNASSIGNED_SCAN)));
            section.allItems = snap.docs
              .map(d => ({ id: d.id, data: d.data() }))
              .filter(it => { const b = it.data.brandId; return !b || b === 'uncategorized'; });
            section.total = section.allItems.length;
          }
          if (!section.allItems.length) {
            if (section.hideIfEmpty) { if (section.el && section.el.parentNode) section.el.remove(); return; }
            // Brand with no products: render the empty state (don't leave the skeleton spinning).
            section.pages[pageIndex] = [];
            section.hasNext[pageIndex] = false;
            renderSectionPage(section, pageIndex);
            return;
          }
          const start = pageIndex * PAGE_SIZE;
          section.pages[pageIndex] = section.allItems.slice(start, start + PAGE_SIZE);
          section.hasNext[pageIndex] = (start + PAGE_SIZE) < section.allItems.length;
          renderSectionPage(section, pageIndex);
          return;
        }
        // Per-brand (and the no-brand "all" section): TRUE cursor pagination.
        // Page 1 loads only when the section appears; page N>1 loads only on Next/swipe,
        // using startAfter(last doc of the previous page). Each page is cached in
        // section.pages[pageIndex]; section.cursors[pageIndex] is that page's last doc.
        // We fetch 13, render 12, and use the 13th only to decide whether Next exists.
        const afterDoc = pageIndex > 0 ? section.cursors[pageIndex - 1] : null;
        const snap = await getDocs(productQuery(section, afterDoc));
        const docs = snap.docs;
        const hasNext = docs.length > PAGE_SIZE;            // 13th doc → a Next page exists
        const display = docs.slice(0, PAGE_SIZE);           // render only the first 12
        section.pages[pageIndex] = display.map(d => ({ id: d.id, data: d.data() }));
        section.hasNext[pageIndex] = hasNext;
        if (hasNext && display.length) section.cursors[pageIndex] = display[display.length - 1];
        renderSectionPage(section, pageIndex);              // empty page 1 → renders the empty state
      } catch (err) {
        // No silent fallback. If the (published, brandId, createdAt) composite index is
        // missing, Firestore throws FAILED_PRECONDITION — surface it instead of masking it.
        const needsIndex = /index/i.test(err && (err.message || err.code || ''));
        if (needsIndex) {
          console.error('[catalog] Products query needs the composite index ' +
            '(products: published ASC, brandId ASC, createdAt DESC). Add it to firestore.indexes.json and run ' +
            '`firebase deploy --only firestore:indexes`, then wait for it to finish building. Brand:', section.id, err);
        } else {
          console.error('Brand products load error:', section.id, err);
        }
        section.gridEl.className = 'catalog-product-grid';
        section.gridEl.setAttribute('aria-busy', 'false');
        // Show the same neutral "No products in this section yet." message as a genuinely
        // empty section — no Retry button. The real cause is still logged to the console above.
        section.gridEl.innerHTML = `<p class="catalog-products-empty">${escapeHtml(t('catalog.products.empty', 'No products in this section yet.'))}</p>`;
        if (section.pagerEl) section.pagerEl.hidden = true;
      } finally {
        section.loading = false;
      }
    }

    // Lightweight horizontal swipe (does not hijack vertical scroll).
    function attachSwipe(section) {
      let x0 = null, y0 = null;
      const host = section.el.querySelector('.catalog-brand-products');
      host.addEventListener('touchstart', (e) => { const tch = e.changedTouches[0]; x0 = tch.clientX; y0 = tch.clientY; }, { passive: true });
      host.addEventListener('touchend', (e) => {
        if (x0 == null) return;
        const tch = e.changedTouches[0];
        const dx = tch.clientX - x0, dy = tch.clientY - y0;
        x0 = null;
        if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
        if (dx < 0 && section.hasNext[section.pageIndex]) loadSectionPage(section, section.pageIndex + 1);
        else if (dx > 0 && section.pageIndex > 0) loadSectionPage(section, section.pageIndex - 1);
      }, { passive: true });
    }

    async function renderBrandSection(info, beforeEl) {
      const section = {
        id: info.id, mode: info.mode, pageIndex: 0,
        pages: [], cursors: [], hasNext: {}, total: null, loading: false,
        hideIfEmpty: !!info.hideIfEmpty,
        el: null, gridEl: null, pagerEl: null
      };
      const el = document.createElement('section');
      el.className = 'catalog-brand-section' + (info.name ? '' : ' catalog-brand-section--untitled');
      const prevLabel = escapeHtml(t('catalog.previous', 'Previous'));
      const nextLabel = escapeHtml(t('catalog.next', 'Next'));
      const navLabel = escapeHtml(info.name || t('catalog.uncategorized', 'Uncategorized'));
      el.innerHTML = `
        ${info.name ? `<div class="catalog-brand-header">
          ${info.image ? `<div class="catalog-brand-media">
            <img src="${escapeHtml(info.image)}" alt="${escapeHtml(info.imageAlt || info.name || t('catalog.brand.imageAlt', 'Brand logo'))}" loading="lazy" decoding="async">
          </div>` : ''}
          <div class="catalog-brand-heading">
            <h2 class="catalog-brand-title">${escapeHtml(info.name)}</h2>
            ${info.description ? `<p class="catalog-brand-description">${escapeLines(info.description)}</p>` : ''}
          </div>
        </div>` : ''}
        <div class="catalog-brand-products">
          <button type="button" class="brand-arrow brand-arrow--prev" aria-label="${prevLabel}" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="catalog-product-grid" aria-busy="true">${skeletonCards(3)}</div>
          <button type="button" class="brand-arrow brand-arrow--next" aria-label="${nextLabel}" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <nav class="brand-pagination" aria-label="${navLabel}" hidden><span class="brand-page-indicator"></span></nav>
        </div>`;
      section.el = el;
      section.gridEl = el.querySelector('.catalog-product-grid');
      section.pagerEl = el.querySelector('.brand-pagination');
      section.prevBtn = el.querySelector('.brand-arrow--prev');
      section.nextBtn = el.querySelector('.brand-arrow--next');
      section.indicatorEl = el.querySelector('.brand-page-indicator');
      section.prevBtn.addEventListener('click', () => { if (section.pageIndex > 0) loadSectionPage(section, section.pageIndex - 1); });
      section.nextBtn.addEventListener('click', () => { if (section.hasNext[section.pageIndex]) loadSectionPage(section, section.pageIndex + 1); });
      if (beforeEl && beforeEl.parentNode === root) root.insertBefore(el, beforeEl);
      else root.appendChild(el);
      watchImages(el); // watch the brand banner image (products are watched on render)

      // Page-indicator total via a cheap server-side COUNT (no docs fetched). Uses only
      // equality filters, so it does NOT need the createdAt composite index. 'unassigned'
      // derives its count client-side in loadSectionPage().
      if (section.mode === 'all' || section.mode === 'brand') {
        try {
          const cons = [where('published', '==', true)];
          if (section.mode === 'brand') cons.push(where('brandId', '==', section.id));
          const cnt = await getCountFromServer(query(collection(db, 'products'), ...cons));
          section.total = cnt.data().count;
        } catch (e) { section.total = null; }
      }

      attachSwipe(section);
      await loadSectionPage(section, 0);
      return section;
    }

    function renderCatalogError() {
      root.setAttribute('aria-busy', 'false');
      root.innerHTML = `
        <div class="catalog-error-state" role="alert">
          <span class="catalog-state-icon" aria-hidden="true">${PKG_ICON}</span>
          <p>${escapeHtml(t('catalog.error', "We couldn't load the catalog right now."))}</p>
          <button type="button" class="catalog-load-more" id="catalog-retry">${escapeHtml(t('catalog.retry', 'Retry'))}</button>
        </div>`;
      document.getElementById('catalog-retry')?.addEventListener('click', () => location.reload());
      loadMoreBtn.hidden = true;
    }

    async function initCatalog() {
      let brands = [];
      try {
        const snap = await getDocs(query(collection(db, 'catalogBrands'),
          where('published', '==', true), orderBy('sortOrder', 'asc'), orderBy('name', 'asc'), limit(BRAND_PAGE + 1)));
        brands = snap.docs;
      } catch (e) {
        // Likely the catalogBrands rules/index aren't deployed yet — fall back gracefully.
        console.warn('catalogBrands unavailable; showing Uncategorized fallback.', e);
        brands = [];
      }

      root.innerHTML = ''; // clear skeleton

      if (!brands.length) {
        // No brands → one untitled section over ALL published products.
        await renderBrandSection({ id: '__all__', mode: 'all', name: '', description: '' });
        loadMoreBtn.hidden = true;
        root.setAttribute('aria-busy', 'false');
        return;
      }

      brandCursor.hasMore = brands.length > BRAND_PAGE;
      const firstBrands = brands.slice(0, BRAND_PAGE);
      brandCursor.last = firstBrands[firstBrands.length - 1];
      for (const bd of firstBrands) {
        const b = bd.data();
        await renderBrandSection({ id: bd.id, mode: 'brand', name: firstNonEmpty(b.name) || t('catalog.uncategorized', 'Uncategorized'), description: firstNonEmpty(b.description), image: firstNonEmpty(b.thumbUrl, b.imageUrl), imageAlt: firstNonEmpty(b.imageAlt) });
      }

      // Catch-all: any published product with no brand (or explicit 'uncategorized'),
      // shown last in an untitled section. Only appears if such products exist.
      const unc = await renderBrandSection({ id: '__unassigned__', mode: 'unassigned', name: '', description: '', hideIfEmpty: true });
      uncategorizedEl = (unc && unc.el && unc.el.parentNode) ? unc.el : null;

      loadMoreBtn.hidden = !brandCursor.hasMore;
      root.setAttribute('aria-busy', 'false');
    }

    loadMoreBtn.addEventListener('click', async () => {
      if (brandCursor.done || !brandCursor.last || loadMoreBtn.dataset.loading === '1') return;
      loadMoreBtn.dataset.loading = '1';
      loadMoreBtn.disabled = true;
      const label = loadMoreBtn.textContent;
      loadMoreBtn.textContent = t('catalog.loadingBrands', 'Loading…');
      try {
        const snap = await getDocs(query(collection(db, 'catalogBrands'),
          where('published', '==', true), orderBy('sortOrder', 'asc'), orderBy('name', 'asc'),
          startAfter(brandCursor.last), limit(BRAND_PAGE + 1)));
        const docs = snap.docs;
        brandCursor.hasMore = docs.length > BRAND_PAGE;
        const next = docs.slice(0, BRAND_PAGE);
        if (next.length) brandCursor.last = next[next.length - 1];
        else brandCursor.done = true;
        for (const bd of next) {
          const b = bd.data();
          await renderBrandSection({ id: bd.id, mode: 'brand', name: firstNonEmpty(b.name) || t('catalog.uncategorized', 'Uncategorized'), description: firstNonEmpty(b.description), image: firstNonEmpty(b.thumbUrl, b.imageUrl), imageAlt: firstNonEmpty(b.imageAlt) }, uncategorizedEl);
        }
        loadMoreBtn.hidden = !brandCursor.hasMore;
        loadMoreBtn.textContent = label;
      } catch (err) {
        console.error('Load more brands error:', err);
        loadMoreBtn.textContent = t('catalog.retry', 'Retry');
      } finally {
        loadMoreBtn.dataset.loading = '';
        loadMoreBtn.disabled = false;
      }
    });

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      await initCatalog();
    } catch (err) {
      console.error('Catalog init error:', err);
      renderCatalogError();
    }
  </script>
</body></html>
